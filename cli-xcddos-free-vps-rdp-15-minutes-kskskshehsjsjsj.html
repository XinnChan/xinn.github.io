<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>XCDDOS CLI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100vw; height: 100vh; border: 0; display: block; }
    .brand-overlay {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      z-index: 999999;
      pointer-events: none;
      text-shadow: 0 0 6px #000, 0 0 3px #000;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 8px;
      border-radius: 4px;
      user-select: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://cli.h2.nexus"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer"
  ></iframe>
  <div class="brand-overlay">POWERED BY xcddos.xyz</div>
</body>
</html>
